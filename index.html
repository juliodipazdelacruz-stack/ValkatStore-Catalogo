<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap');
:root{--bg:#fff;--surface:#fff;--soft:#F1F7FC;--tint:#E1EFFA;--ink:#0E2238;--muted:#5F7186;--line:#DCE7F1;--blue:#1F64AD;--blue-d:#164A82;--teal:#17ADAC;--teal-d:#0E7F7E;--gray:#B3B3B3;--on-blue:#fff;--live:#FF2D55;--ok:#12805C;--hot:#C2410C;--hot-bg:#FFEDE0;--sh:0 16px 36px -16px rgba(14,47,87,.4);--sh-s:0 4px 14px -6px rgba(14,47,87,.28);--r:18px;--hh:80px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{color-scheme:light;background:#fff}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.45 'Figtree',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#fff;z-index:40}
h1,h2,h3,h4{font-family:'Outfit','Figtree',sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.w{max-width:1480px;margin:0 auto;padding-inline:16px}
/* encabezado con toldo */
.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#fff}
.hdi{display:flex;align-items:center;gap:14px;padding-block:10px 8px}
.hd img{height:44px;width:auto;display:block}
.sbox{flex:1;max-width:560px;margin-inline:auto;display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;background:var(--soft);border:1.5px solid transparent;border-radius:999px}
.sbox:focus-within{background:#fff;border-color:var(--blue)}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:16px}
.ib{height:44px;min-width:44px;padding:0 16px;border:0;border-radius:999px;background:var(--blue);color:#fff;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:var(--sh-s)}
.ib .n{background:#fff;color:var(--blue);border-radius:999px;font-size:12px;font-weight:800;min-width:22px;text-align:center;padding:1px 6px}
.awn{height:14px;background:repeating-linear-gradient(90deg,var(--blue) 0 28px,var(--teal) 28px 56px);-webkit-mask:linear-gradient(#000 0 0) top/100% 4px no-repeat,radial-gradient(circle 14px at 14px 0,#000 13.5px,transparent 14.5px) 0 0/28px 100% repeat-x;mask:linear-gradient(#000 0 0) top/100% 4px no-repeat,radial-gradient(circle 14px at 14px 0,#000 13.5px,transparent 14.5px) 0 0/28px 100% repeat-x}
@media(max-width:520px){.hd img{height:34px}.hdi{gap:8px}.ib{padding:0 12px}}
/* live */
.strip{display:flex;align-items:center;gap:12px;margin:16px 0 0;padding:12px 16px;border-radius:var(--r);background:linear-gradient(100deg,#101828,#3a0f22);color:#fff;font-size:14px}
.strip .st{flex:1;min-width:0}
.strip a{color:#fff;font-weight:700;text-decoration:none;background:var(--live);padding:8px 16px;border-radius:999px;white-space:nowrap}
.strip.off{background:var(--soft);color:var(--ink)}.strip.off a{background:#101828}
.rec{width:10px;height:10px;border-radius:50%;background:var(--live);flex-shrink:0;animation:bl 1.2s infinite}
.strip.off .rec{background:var(--gray);animation:none}
@keyframes bl{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.rec{animation:none}}
/* categorías: carril lateral en pantalla grande, fichas en celular */
.shell{display:grid;grid-template-columns:minmax(0,1fr)}
.side{position:sticky;top:calc(var(--hh) + env(safe-area-inset-top,0px));z-index:20;background:#fff;margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--line)}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.cats button{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:8px 14px;font:600 14px 'Figtree',sans-serif}
.cats .ic{font-size:18px}
.cats button.on{background:var(--tint);border-color:var(--blue);color:var(--blue-d)}
@media(min-width:900px){.shell{grid-template-columns:230px minmax(0,1fr);gap:28px}.side{margin:0;padding:22px 0 0;border:0;align-self:start}.cats{flex-direction:column;overflow:visible;gap:6px}.cats button{width:100%;padding:12px 14px;border-color:transparent;font-size:15px}.cats button:hover{background:var(--soft)}.cats button.on{border-color:transparent;box-shadow:inset 4px 0 0 var(--teal)}}
/* productos */
.sec{scroll-margin-top:calc(var(--hh) + 74px)}
.sh{display:flex;align-items:center;gap:10px;margin:26px 0 4px}
.sh h2{font-size:26px;font-weight:800}
.sh .cn{background:var(--tint);color:var(--blue-d);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.sb{color:var(--muted);font-size:14px;margin-bottom:14px}
.list{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:700px){.list{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1250px){.list{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1500px){.list{grid-template-columns:repeat(5,minmax(0,1fr))}}
.it{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-s);overflow:hidden;transition:transform .18s,box-shadow .18s}
.it[hidden]{display:none}
@media(hover:hover){.it:hover{transform:translateY(-3px);box-shadow:var(--sh)}}
.ph{position:relative;margin:8px 8px 0;width:calc(100% - 16px);border:0;border-radius:14px;background:linear-gradient(160deg,var(--soft),var(--tint));aspect-ratio:1/1;padding:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:64px;color:inherit}
.ph .vd{position:absolute;left:8px;bottom:8px;background:rgba(14,34,56,.85);color:#fff;font:700 11px 'Figtree',sans-serif;padding:3px 9px;border-radius:999px}
.inf{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.inf h3{font-size:15.5px;line-height:1.25;font-weight:700}
.inf .gf{align-self:flex-start;font-size:12px;font-weight:700;color:var(--teal-d);background:rgba(23,173,172,.13);padding:3px 9px;border-radius:999px}
.row{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:4px}
.pc{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;font:800 20px 'Outfit',sans-serif}.pc.d{color:var(--blue)}
.pc s{order:2;font:500 13px 'Figtree',sans-serif;color:var(--muted)}
.dsc{order:3;font:800 11px 'Figtree',sans-serif;background:var(--hot-bg);color:var(--hot);padding:2px 8px;border-radius:999px}
.pl{width:100%;height:44px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-weight:800;font-size:14.5px}
.pl:active{transform:scale(.98)}
.ctl .st2{width:100%}.ctl .st2 button{flex:0 0 48px;height:42px;font-size:18px}.ctl .st2 span{flex:1;text-align:center}
.none{text-align:center;color:var(--muted);padding:28px 0}
/* marcas */
.brands{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:18px 0 0;padding-bottom:2px}
.brands[hidden]{display:none}
.brands button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:7px 16px;font:600 14px 'Figtree',sans-serif}
.brands button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.mk{align-self:flex-start;font:700 11px 'Figtree',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--teal-d)}
.ft{margin:40px 0 120px;text-align:center;color:var(--muted);font-size:12.5px}
.ft button{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12.5px}
/* detalle (hoja inferior en celular, ventana en pantalla grande) */
.ov{position:fixed;inset:0;background:rgba(8,20,36,.55);z-index:60;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
@media(min-width:700px){.ov{align-items:center;padding:16px}}
.md{background:#fff;width:100%;max-width:820px;max-height:94%;overflow:auto;border-radius:24px 24px 0 0;box-shadow:var(--sh);display:grid;position:relative;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(min-width:700px){.md{border-radius:24px;grid-template-columns:1.1fr 1fr}}
@media(prefers-reduced-motion:reduce){.md,.dr{animation:none;transition:none}}
.mm{background:var(--soft);display:flex;flex-direction:column}
.stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;background:var(--soft);font-size:96px;min-height:260px}
.sl{width:100%;height:100%;display:flex;align-items:center;justify-content:center;min-height:260px}
.stage img{max-width:100%;max-height:420px}
.stage video{width:100%;height:100%;max-height:420px;object-fit:contain;background:#000}
.nv{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--blue-d);font-size:24px;line-height:1;box-shadow:var(--sh-s)}.pv{left:10px}.nx{right:10px}
.th{display:flex;gap:8px;padding:10px;overflow-x:auto;background:#fff;border-top:1px solid var(--line)}
.th button{flex:0 0 56px;height:56px;border:2px solid var(--line);border-radius:12px;background:var(--soft);padding:0;overflow:hidden;font-size:20px;color:var(--ink)}
.th button.on{border-color:var(--blue)}.th img{width:100%;height:100%;object-fit:cover}
.mi{padding:20px 20px 18px;display:flex;flex-direction:column;gap:10px}
.mi h2{font-size:24px;line-height:1.1;padding-right:40px}
.mi .sk{font-size:12px;color:var(--muted)}
.mi ul{margin:2px 0;padding-left:18px;display:grid;gap:5px;font-size:14.5px}
.mi .gift{background:rgba(23,173,172,.12);color:var(--teal-d);padding:10px 12px;font-size:13px;font-weight:600;border-radius:12px}
.big{margin-top:auto;width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;font:700 16px 'Outfit',sans-serif;padding:15px}
.cl{position:absolute;top:10px;right:10px;z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.95);color:var(--ink);font-size:15px;box-shadow:var(--sh-s)}
/* pedido lateral */
.dr{position:fixed;inset:0 0 0 auto;width:min(440px,100%);background:#fff;z-index:70;transform:translateX(105%);transition:transform .22s;box-shadow:var(--sh);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:520px){.dr{border-radius:24px 0 0 24px}}
.dr.show{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.dh h3{font-size:20px}
.db{flex:1;overflow:auto;padding:4px 18px 12px}
.ln{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ln .t{width:46px;height:46px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
.ln b{font-size:14px;line-height:1.2;display:block}.ln small{color:var(--muted);font-size:12px}
.st2{display:flex;align-items:center;border:1.5px solid var(--blue);border-radius:999px;overflow:hidden}
.st2 button{width:32px;height:32px;border:0;background:transparent;color:var(--blue);font-weight:800}
.st2 span{min-width:26px;text-align:center;font-weight:800;font-size:14px}
.mb{margin:14px 0;border:1.5px dashed var(--teal);border-radius:16px;padding:14px;background:var(--soft)}
.mb h4{font-size:15px}.mb p{margin:3px 0 9px;font-size:12.5px;color:var(--muted)}
.op{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:6px;font-size:13px}
.op b{font-weight:700}.op .pp s{color:var(--muted);margin-right:5px;font-size:12px}.op .pp strong{color:var(--blue)}
.lk{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:8px 0 0}
.df{border-top:1px solid var(--line);padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));background:#fff}
.tt{display:grid;gap:3px;font-size:14px;margin-bottom:12px}.tt div{display:flex;justify-content:space-between}
.tt .a{color:var(--hot);font-weight:700}.tt .f{color:var(--ok);font-weight:700}
.tt .z{font:800 20px 'Outfit',sans-serif;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.wa{width:100%;border:0;border-radius:14px;background:var(--ok);color:#fff;font:700 16px 'Outfit',sans-serif;padding:15px}
.dim{position:fixed;inset:0;background:rgba(8,20,36,.5);z-index:65;display:none}.dim.show{display:block}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;width:min(94%,480px)}
.bar button{width:100%;border:0;border-radius:999px;background:var(--blue);color:#fff;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;padding:14px 22px;font:700 15px 'Outfit',sans-serif}
.bar[hidden]{display:none}.bar .sp{flex:1;text-align:left}
/* resumen del pedido */
#tk{z-index:80;align-items:center;padding:12px}
.tkm{background:var(--surface);width:100%;max-width:520px;max-height:94%;display:flex;flex-direction:column;border-radius:22px;box-shadow:var(--sh);overflow:hidden}
.tkm h3{padding:12px 16px;font-size:16px;border-bottom:1.5px solid var(--line)}
.tkw{overflow:auto;margin:12px 14px 0;border:1.5px solid #CBD7E4;border-radius:8px;background:#fff;color:#0E2238}
.tkh{display:flex;align-items:center;gap:12px;padding:14px;background:linear-gradient(120deg,#1F64AD,#17ADAC);color:#fff;flex-wrap:wrap}
.tkh img{height:34px;background:#fff;border-radius:6px;padding:4px 8px;display:block}
.tkh .ti{flex:1;min-width:150px}.tkh b{font:800 16px 'Outfit',sans-serif;display:block}.tkh small{display:block;font-size:11.5px;opacity:.92}
.tkn{text-align:right}.tkn b{font-size:15px}
.tkr{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-bottom:1.5px dashed #CBD7E4}
.tkr .im{width:48px;height:48px;border:1px solid #CBD7E4;border-radius:6px;background:#EAF1F9;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
.tkr .im img{width:100%;height:100%;object-fit:cover}
.tkr b{font-size:14px;line-height:1.2;display:block}.tkr small{display:block;color:#5A6B7F;font-size:12px}
.tkr .pr{text-align:right;font:800 15px 'Outfit',sans-serif}.tkr .pr s{display:block;font:500 11.5px 'Figtree',sans-serif;color:#5A6B7F}
.tkr .pr em{display:block;font:700 10.5px 'Figtree',sans-serif;color:#C2410C;font-style:normal}.tkr .pr.gr{color:#0E7F7E}
.tkt{padding:10px 14px 14px;display:grid;gap:4px;font-size:14px}.tkt div{display:flex;justify-content:space-between}
.tkt .d{color:#C2410C;font-weight:700}.tkt .z{font:800 18px 'Outfit',sans-serif;color:#1F64AD;border-top:1.5px solid #CBD7E4;padding-top:8px;margin-top:4px}
.tks{padding:10px 16px 0;text-align:center;font-size:13px;font-weight:700;color:var(--ok);min-height:34px}
.tkbtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 14px 14px}
.tkbtn button{border:1.5px solid var(--line);border-radius:12px;padding:11px;font-weight:700;background:var(--soft);color:var(--ink)}
.tkbtn .go2{grid-column:1/-1;background:var(--ok);color:#fff;border-color:var(--ok);font:700 15px 'Outfit',sans-serif;padding:13px}
.tkbtn .cx{grid-column:1/-1;background:transparent;border-color:var(--line)}
.tkbtn .go3{grid-column:1/-1;background:#fff;color:var(--ok);border-color:var(--ok)}
</style>
</head>
